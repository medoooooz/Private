name: Check Canva Link

on:
  schedule:
    - cron: "*/10 * * * *"   # كل 10 دقايق (ممكن تغيّرها)
  workflow_dispatch:          # يسمحلك تشغّله يدوي من GitHub لو حبيت تجرب

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        run: python check_canva.py

      - name: Commit updated link file (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_canva_link.txt
          git diff --staged --quiet || git commit -m "update last canva link"
          git push
